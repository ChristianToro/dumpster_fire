<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>US Debt Dumpster Fire</title>
  <meta name="description" content="The US national debt, live, from Treasury's Debt to the Penny data.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Cpath d='M3 9V6h2V3h2v3h2V1h2v5h2v3Z' fill='%23f0441e'/%3E%3Cpath d='M5 9V7h2V5h2v4Z' fill='%23ffe04e'/%3E%3Crect x='1' y='9' width='14' height='6' fill='%23297563'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="asset/dumpster.css">
  <link rel="stylesheet" href="site.css">
</head>
<body data-view="landing">
  <main>
    <button class="dumpster-button" type="button" aria-label="Show the current US national debt">
      <div class="dumpster-fire" data-dumpster-fire></div>
    </button>

    <section class="debt" aria-labelledby="debt-label">
      <h1 id="debt-label" class="debt-label">US national debt</h1>
      <p class="ticker" aria-hidden="true">Loading…</p>
      <p class="sr-only" data-ticker-summary></p>
      <p class="caption" data-caption></p>

      <figure class="chart" hidden>
        <figcaption class="chart-title">Total public debt outstanding since 2000</figcaption>
        <div class="chart-plot" data-chart></div>
        <details class="chart-table">
          <summary>Year-end values</summary>
          <table>
            <thead><tr><th scope="col">Date</th><th scope="col">Total public debt</th></tr></thead>
            <tbody data-year-table></tbody>
          </table>
        </details>
      </figure>
    </section>
  </main>
  <script src="asset/dumpster.js" defer></script>
  <script src="src/app.js" type="module"></script>
</body>
</html>
